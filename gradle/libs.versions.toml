[versions]
agp = "8.9.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
fragment = "1.8.6"
swiperefreshlayoutVersion = "1.1.0"
volley = "1.2.1"
glide = "4.12.0"
retrofit = "2.11.0"
gson = "2.12.1"
kotlin = "2.1.20"
coreKtx = "1.15.0"
lifecycle_version = "2.8.7"
fragment_ktx_version = "1.8.6"
okhttp-logging = "4.11.0"
play-services-location-version = "21.3.0"
room =  "2.6.1"
ksp = "2.1.20-1.0.31"
datastore = "1.1.4"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayoutVersion" }
volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }
bumptech = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofitConverterGson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle_version" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment_ktx_version" }
okhttplogging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp-logging" }
playserviceslocation = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location-version" }
roomruntime = { module = "androidx.room:room-runtime", version.ref = "room" }
roomktx = { module = "androidx.room:room-ktx", version.ref = "room" }
roomcompiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore = {module = "androidx.datastore:datastore", version.ref = "datastore"}
datastorepreferences = {module = "androidx.datastore:datastore-preferences", version.ref = "datastore"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

